<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waypoints</title>
<meta name="description" content="A map of the places I have been, with photographs, dates and a timeline.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

<a class="salta-a" href="#mappa">Skip to the map</a>

<header class="intestazione">
  <div class="intestazione__testo">
    <h1 class="intestazione__titolo" data-titolo>Waypoints</h1>
    <p class="intestazione__sottotitolo" data-sottotitolo hidden></p>
  </div>
  <p class="numeri" data-numeri hidden tabindex="0" role="button"
     title="Extremes reached and length of the trail">
    <span class="numeri__voce"><b data-numero="paesi">0</b> <span data-etichetta="paesi">countries</span></span>
    <span class="numeri__voce"><b data-numero="luoghi">0</b> <span data-etichetta="luoghi">places</span></span>
    <span class="numeri__voce"><b data-numero="continenti">0</b> <span data-etichetta="continenti">continents</span></span>
  </p>
  <p class="ricorrenza" data-ricorrenza hidden></p>
</header>

<main class="scena">
  <div id="mappa" class="mappa" tabindex="-1"></div>

  <div class="avviso" data-avviso hidden>
    <div class="avviso__contenuto" data-avviso-contenuto></div>
  </div>

  <aside class="pannello" data-pannello hidden aria-labelledby="pannello-titolo">
    <button class="pannello__chiudi" data-chiudi-pannello type="button" aria-label="Close">✕</button>
    <div class="pannello__corpo" data-pannello-corpo></div>
  </aside>
</main>

<footer class="timeline" data-timeline hidden></footer>

<div class="ricerca" data-ricerca hidden role="dialog" aria-modal="true" aria-label="Search the diary">
  <div class="ricerca__scatola">
    <input class="ricerca__campo" data-ricerca-campo type="search" autocomplete="off"
           placeholder="search a place or a country" aria-label="Search a place or a country"
           aria-controls="ricerca-esiti">
    <ul class="ricerca__esiti" id="ricerca-esiti" data-ricerca-esiti></ul>
  </div>
</div>

<div class="lightbox" data-lightbox hidden role="dialog" aria-modal="true" aria-label="Photograph"></div>

<script src="./vendor/leaflet/leaflet.js"></script>
<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
